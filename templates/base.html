<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}DigiSign{% endblock %} - DigiSign</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-100 min-h-screen">
<nav class="bg-slate-900 text-white px-6 py-4 flex flex-wrap justify-between items-center gap-2">
<span class="text-xl font-bold">DigiSign</span>
<div class="space-x-4 text-sm">
<a href="{{ url_for('index') }}" class="hover:text-sky-400">Beranda</a>
<a href="{{ url_for('sign_page') }}" class="hover:text-sky-400">Tanda Tangan</a>
<a href="{{ url_for('verify_page') }}" class="hover:text-sky-400">Verifikasi</a>
<a href="{{ url_for('benchmark_page') }}" class="hover:text-sky-400">Uji Kuantitatif</a>
</div>
</nav>
<main class="{% block width %}max-w-4xl{% endblock %} mx-auto p-6">
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="mb-4 space-y-2">
{% for category, message in messages %}
<div class="px-4 py-3 rounded {{ 'bg-red-100 text-red-700' if category == 'error' else 'bg-green-100 text-green-700' }}">{{ message }}</div>
{% endfor %}
</div>
{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
